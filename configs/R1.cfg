enable
configure terminal

! Interface to R2 (Area 0)
interface GigabitEthernet0/0
 ip address 10.0.12.1 255.255.255.252
 no shutdown
 exit

! Interface to PC3 (Area 1 - Stub)
interface GigabitEthernet0/1
 ip address 192.168.1.1 255.255.255.0
 no shutdown
 exit

 ! Enable OSPF process 1
router ospf 1

! Network to R2 - in Area 0 (Backbone)
 network 10.0.12.0 0.0.0.3 area 0

! Network with PC3 - in Area 1 (Stub)
 network 192.168.1.0 0.0.0.255 area 1

! Make Area 1 Stub (won't receive external routes)
 area 1 stub

 exit
