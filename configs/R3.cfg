enable
configure terminal

! Interface to R2 (Area 51 - NSSA)
interface GigabitEthernet0/0
 ip address 10.0.23.2 255.255.255.252
 no shutdown
 exit

! Interface to R4 (RIP network)
interface GigabitEthernet0/1
 ip address 192.168.100.1 255.255.255.0
 no shutdown
 exit

 ! Enable OSPF process 1
router ospf 1
 network 10.0.23.0 0.0.0.3 area 51
 area 51 nssa
 exit

! Enable RIP
router rip
 version 2
 network 192.168.100.0
 no auto-summary
 exit

! Import RIP routes into OSPF
router ospf 1
 redistribute rip subnets metric 100
 exit
